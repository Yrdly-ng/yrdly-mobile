name: Android Firebase Installations preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/firebase/android-client.json'
      - 'scripts/verify-firebase-installations.cjs'
      - 'scripts/validate-android-firebase.cjs'
      - '.github/workflows/firebase-android-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-android-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android Firebase client credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed configuration
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate YRDLY Android Firebase project and package
        run: node scripts/validate-android-firebase.cjs config/firebase/android-client.json
      - name: Verify Firebase Installations API and auth-token issuance
        run: node scripts/verify-firebase-installations.cjs config/firebase/android-client.json
