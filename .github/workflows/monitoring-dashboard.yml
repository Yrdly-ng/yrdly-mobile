name: Publish Sentry monitoring dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-monitoring-dashboard
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify YRDLY dashboard
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 scripts/publish-sentry-dashboard.py
