name: Build Android APK

on:
  # One-time QA build when this workflow is updated on main. Ordinary
  # application commits will NOT trigger this potentially expensive APK job.
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      note:
        description: 'Build note (optional)'
        required: false
        default: 'Manual build'

permissions:
  contents: read

# Avoid duplicate QA builds for the same branch when workflow is edited.
concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    timeout-minutes: 110
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: production
      YRDLY_BUILD_NUMBER: ${{ github.run_number }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        run: npm install --global pnpm@11.2.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure telemetry build uploads
        run: node scripts/configure-telemetry-build.cjs


      - name: Write .env file from secrets
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_PAYLUK_PUBLIC_KEY=${{ secrets.EXPO_PUBLIC_PAYLUK_PUBLIC_KEY }}
          EXPO_PUBLIC_WEB_APP_URL=${{ secrets.EXPO_PUBLIC_WEB_APP_URL }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_VEXO_API_KEY=${{ secrets.EXPO_PUBLIC_VEXO_API_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY=${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST=${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EOF

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node -e 'const fs = require("fs"); const value = process.env.GOOGLE_SERVICES_JSON; if (!value) throw new Error("Missing GOOGLE_SERVICES_JSON"); require("./scripts/validate-android-firebase.cjs").validateAndroidFirebase(JSON.parse(value)); fs.writeFileSync("google-services.json", value, { mode: 0o600 });'

      - name: Validate native Google Maps configuration
        run: node -e 'if (!(process.env.GOOGLE_MAPS_ANDROID_API_KEY || require("fs").readFileSync(".env", "utf8").match(/^EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=(.+)$/m)?.[1]?.trim())) throw new Error("Missing Android Google Maps key");'

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Verify generated Android Firebase setup
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const root = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const generatedPath = 'android/app/google-services.json';
          if (!fs.existsSync(generatedPath)) {
            throw new Error('Expo prebuild did not copy google-services.json to android/app. Firebase cannot initialize from this APK.');
          }
          const generated = JSON.parse(fs.readFileSync(generatedPath, 'utf8'));
          const select = config => config.client.find(x => x.client_info?.android_client_info?.package_name === 'com.yrdly');
          const source = select(root), copy = select(generated);
          if (!source || !copy) throw new Error('Firebase config missing com.yrdly Android client');
          if (source.api_key?.[0]?.current_key !== copy.api_key?.[0]?.current_key ||
              source.client_info?.mobilesdk_app_id !== copy.client_info?.mobilesdk_app_id) {
            throw new Error('Expo prebuild copied a different Firebase client configuration');
          }
          const expectedKeyHash = 'f46314d52071bbf12734aa86e54d31b74468851e7a618359af1da63dd4df2d90';
          const actualKeyHash = crypto.createHash('sha256').update(copy.api_key[0].current_key).digest('hex');
          if (actualKeyHash !== expectedKeyHash) throw new Error('Firebase API key is not the expected restricted Android QA key');
          const appGradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          if (!appGradle.includes('com.google.gms.google-services')) {
            throw new Error('Expo generated android/app/build.gradle WITHOUT the Google Services plugin; google-services.json will not be compiled into Firebase resources');
          }
          console.log('PASS: prebuild copied the expected Firebase Android config and applied the Google Services Gradle plugin.');
          console.log('Firebase project: ' + root.project_info.project_id + '; package: ' + copy.client_info.android_client_info.package_name);
          NODE

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --info --stacktrace

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at $APK_PATH"

      - name: Verify Firebase resources inside built APK
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const config = JSON.parse(fs.readFileSync('google-services.json','utf8'));
          const client = config.client.find(c => c.client_info?.android_client_info?.package_name === 'com.yrdly');
          const expected = {
            google_api_key: client?.api_key?.[0]?.current_key,
            google_app_id: client?.client_info?.mobilesdk_app_id,
            gcm_defaultSenderId: String(config.project_info.project_number)
          };
          const buildTools = fs.readdirSync(path.join(process.env.ANDROID_HOME,'build-tools'))
            .sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).at(-1);
          const aapt2 = path.join(process.env.ANDROID_HOME,'build-tools',buildTools,'aapt2');
          if (!fs.existsSync(aapt2)) throw new Error('Android aapt2 not found');
          const apkPath = process.env.APK_PATH;
          if (!apkPath || !fs.existsSync(apkPath)) throw new Error('APK not found for Firebase resource inspection');
          const output = cp.execFileSync(aapt2, ['dump','resources',apkPath],
            {encoding:'utf8',maxBuffer:64*1024*1024});
          const lines = output.split(/\r?\n/);
          const readValue = name => {
            for (let i=0; i<lines.length; i++) {
              if (!lines[i].includes('string/'+name)) continue;
              for (let j=i; j<Math.min(lines.length,i+8); j++) {
                if (j>i && /\bresource\s+0x/i.test(lines[j])) break;
                const found=lines[j].match(/"([^"]+)"/);
                if (found) return found[1];
              }
              return null;
            }
            return null;
          };
          for (const [name,value] of Object.entries(expected)) {
            const found = readValue(name);
            if (found === null) {
              throw new Error('Built APK is missing or cannot decode Firebase string resource '+name+
                '. Inspect Google Services Gradle plugin outputs before testing push.');
            }
            if (found !== value) {
              throw new Error('Built APK Firebase resource '+name+' does NOT match GOOGLE_SERVICES_JSON.');
            }
            console.log('PASS: compiled '+name+' matches the expected Firebase configuration.');
          }
          console.log('PASS: signed APK contains the expected Firebase API key, app ID and sender ID (key SHA-256 '+crypto.createHash('sha256').update(expected.google_api_key).digest('hex').slice(0,12)+'...).');
          NODE

      - name: Show APK signing certificate
        if: ${{ always() && env.APK_PATH != '' }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          if [ ! -x "$APK_SIGNER" ]; then
            echo "::error::Android apksigner was not found at $APK_SIGNER"
            exit 1
          fi
          echo "Inspecting Android APK signature: $APK_PATH"
          # Print the actual verifier output, including errors if the APK is unsigned.
          # Never pipe to grep: it hides apksigner errors and may fail on output variations.
          "$APK_SIGNER" verify --verbose --print-certs "$APK_PATH"
          echo "Compare the certificate SHA-1 with YRDLY Firebase Android Push API-key restrictions."

      - name: Upload APK artifact
        if: ${{ always() && env.APK_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: yrdly-android-apk-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
