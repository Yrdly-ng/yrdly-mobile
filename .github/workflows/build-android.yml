name: Build Android APK

on:
  # One-time QA build when this workflow is updated on main. Ordinary
  # application commits will NOT trigger this potentially expensive APK job.
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      note:
        description: 'Build note (optional)'
        required: false
        default: 'Manual build'

permissions:
  contents: read

# Avoid duplicate QA builds for the same branch when workflow is edited.
concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    timeout-minutes: 110
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: production
      YRDLY_BUILD_NUMBER: ${{ github.run_number }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        run: npm install --global pnpm@11.2.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure telemetry build uploads
        run: node scripts/configure-telemetry-build.cjs


      - name: Write .env file from secrets
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_PAYLUK_PUBLIC_KEY=${{ secrets.EXPO_PUBLIC_PAYLUK_PUBLIC_KEY }}
          EXPO_PUBLIC_WEB_APP_URL=${{ secrets.EXPO_PUBLIC_WEB_APP_URL }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_VEXO_API_KEY=${{ secrets.EXPO_PUBLIC_VEXO_API_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY=${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST=${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EOF

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node -e 'const fs = require("fs"); const value = process.env.GOOGLE_SERVICES_JSON; if (!value) throw new Error("Missing GOOGLE_SERVICES_JSON"); require("./scripts/validate-android-firebase.cjs").validateAndroidFirebase(JSON.parse(value)); fs.writeFileSync("google-services.json", value, { mode: 0o600 });'

      - name: Validate native Google Maps configuration
        run: node -e 'if (!(process.env.GOOGLE_MAPS_ANDROID_API_KEY || require("fs").readFileSync(".env", "utf8").match(/^EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=(.+)$/m)?.[1]?.trim())) throw new Error("Missing Android Google Maps key");'

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --info --stacktrace

      - name: Verify compiled Firebase client identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const config = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const client = config.client.find(
            c => c.client_info?.android_client_info?.package_name === 'com.yrdly'
          );
          const key = client?.api_key?.[0]?.current_key;
          if (!key) throw new Error('Firebase client API key missing for com.yrdly');
          // SHA-256 of the new Android QA Firebase API key configured 13 Nov 2026.
          // Do not print the API key itself into Actions logs.
          const expectedKeyHash = 'f46314d52071bbf12734aa86e54d31b74468851e7a618359af1da63dd4df2d90';
          const actualKeyHash = crypto.createHash('sha256').update(key).digest('hex');
          if (actualKeyHash !== expectedKeyHash) {
            throw new Error('GOOGLE_SERVICES_JSON secret has a different Firebase API key than the new Android QA key. Update the secret; do not install this APK.');
          }
          const root = 'android/app/build/generated/res/google-services';
          const xmlFiles = [];
          const walk = dir => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile() && p.endsWith('.xml')) xmlFiles.push(p);
            }
          };
          walk(root);
          if (!xmlFiles.length) throw new Error('Compiled Google Services XML resources missing');
          const embeddedKeys = xmlFiles.map(p => {
            const xml = fs.readFileSync(p, 'utf8');
            const match = xml.match(/<string\b(?=[^>]*\bname=["']google_api_key["'])[^>]*>([^<]*)<\/string>/);
            return match ? {path:p, key:match[1]} : null;
          }).filter(Boolean);
          if (!embeddedKeys.length) throw new Error('Compiled Firebase google_api_key resource missing');
          if (embeddedKeys.some(k => k.key !== key)) throw new Error('Compiled Firebase google_api_key differs from GOOGLE_SERVICES_JSON secret');
          console.log('Verified: new Firebase API key matches the GitHub secret and compiled Android resources (SHA-256 ' + actualKeyHash.slice(0,12) + '...).');
          console.log('Firebase project: ' + config.project_info.project_id + '; Android package: ' + client.client_info.android_client_info.package_name);
          NODE

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at $APK_PATH"

      - name: Show APK signing certificate
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          if [ ! -x "$APK_SIGNER" ]; then
            echo "::error::Android apksigner was not found at $APK_SIGNER"
            exit 1
          fi
          echo "Inspecting Android APK signature: $APK_PATH"
          # Print the actual verifier output, including errors if the APK is unsigned.
          # Never pipe to grep: it hides apksigner errors and may fail on output variations.
          "$APK_SIGNER" verify --verbose --print-certs "$APK_PATH"
          echo "Compare the certificate SHA-1 with YRDLY Firebase Android Push API-key restrictions."

      - name: Upload APK artifact
        if: ${{ always() && env.APK_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: yrdly-android-apk-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
